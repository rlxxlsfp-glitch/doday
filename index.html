<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<title>doday.</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#EC9AB2">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="doday">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --bg:#FFFFFF; --soft:#FBF2F5; --soft2:#F6E5EB; --line:#F1E0E6; --line2:#E7CCD6;
  --text:#3E2A31; --sub:#8C7880; --faint:#B9A8AE;
  --pink:#D2638A; --pink2:#B94F76; --pinkbg:#FCE8EF; --pinkbg2:#F8D5E1;
  --cocoa:#A8765B; --plum:#4A2E37;
  --school:#EEEDF8; --schoolL:#CFCAEE; --acad:#F8ECE4; --acadL:#E5C6B2;
  --free:#EFF5EC; --freeL:#C9DFC3; --meal:#FCF1E5; --mealL:#EED6BA;
  --ok:#5B9A6E; --warn:#D8954A; --no:#A39398;
  --shadow:0 10px 30px rgba(120,50,75,.10);
  --ease:cubic-bezier(.2,.8,.2,1);
}
html[data-theme=dark]{
  --bg:#141013; --soft:#1E181B; --soft2:#2A2125; --line:#2C2428; --line2:#3D3237;
  --text:#F5EAEE; --sub:#A7969C; --faint:#6E5F64;
  --pink:#E8809F; --pink2:#F097B2; --pinkbg:#3A2029; --pinkbg2:#4A2834;
  --cocoa:#C99477; --plum:#2A1B21;
  --school:#211F2E; --schoolL:#3B3760; --acad:#2B211C; --acadL:#5C4334;
  --free:#1C251D; --freeL:#35503A; --meal:#2B2219; --mealL:#57432C;
  --ok:#7CC08F; --warn:#E6A764; --no:#857479;
  --shadow:0 10px 30px rgba(0,0,0,.4);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text)}
body{font-family:"Pretendard Variable",Pretendard,-apple-system,"Noto Sans KR","Noto Sans CJK KR",sans-serif;
  font-size:15px;line-height:1.5;letter-spacing:-.2px;padding-bottom:calc(86px + env(safe-area-inset-bottom));
  transition:background .25s,color .25s;overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea,select{font:inherit;color:var(--text)}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.wrap{max-width:640px;margin:0 auto;padding:0 22px 30px}

/* top */
.top{position:sticky;top:0;z-index:30;background:var(--bg);transition:background .25s}
.topin{max-width:640px;margin:0 auto;height:58px;padding:0 22px;display:flex;align-items:center;justify-content:space-between}
.logo{font-size:26px;font-weight:850;letter-spacing:-1.2px}
.logo b{color:var(--pink)}
.ghost{height:34px;padding:0 13px;border-radius:999px;background:var(--soft);font-size:13px;font-weight:600;color:var(--sub);display:inline-flex;align-items:center;gap:4px}

/* timer bar */
.tbar{position:sticky;top:58px;z-index:29;background:var(--plum);color:#fff;display:none}
.tbar.on{display:block;animation:drop .25s var(--ease)}
.tbin{max-width:640px;margin:0 auto;padding:10px 22px;display:flex;align-items:center;gap:10px}
.tbin .tt{flex:1;min-width:0;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px}
.tbin .tn{font-size:18px;font-weight:750;font-variant-numeric:tabular-nums;color:#FFC9D8}
.tbin button{height:30px;padding:0 11px;border-radius:999px;font-size:12.5px;font-weight:650;background:rgba(255,255,255,.14);display:inline-flex;align-items:center;gap:4px}
.tbin button.end{background:var(--pink);color:#fff}
.tbin svg.i{width:15px;height:15px}
@keyframes drop{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}

/* views */
.view{display:none}
.view.on{display:block}
.view.enter{animation:vfade .2s ease-out}
.view.sl,.calbox.sl{animation:vsl .22s var(--ease)}
.view.sr,.calbox.sr{animation:vsr .22s var(--ease)}
@keyframes vfade{from{opacity:0}to{opacity:1}}
@keyframes vsl{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes vsr{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}

.date{font-size:14px;font-weight:600;color:var(--sub);margin-top:8px}
h1{font-size:28px;font-weight:800;letter-spacing:-1px;line-height:1.3;margin-top:2px}
h2{font-size:19px;font-weight:780;letter-spacing:-.6px}
.sec{margin-top:30px}
.sech{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-bottom:12px}
.sech p{font-size:13px;color:var(--sub);margin-top:2px}
.muted{color:var(--sub)}

.dnav{display:flex;align-items:center;gap:6px;margin-top:6px}
.dnav button.arr{width:34px;height:34px;border-radius:50%;background:var(--soft);display:grid;place-items:center;color:var(--sub)}
.dnav .dtitle{flex:1}

/* hero */
.hero{margin-top:18px;border-radius:24px;padding:22px 22px 20px;color:#fff;
  background:linear-gradient(135deg,#E584A4 0%,#C9587F 100%);box-shadow:0 14px 30px rgba(201,88,127,.25);position:relative;overflow:hidden}
html[data-theme=dark] .hero{background:linear-gradient(135deg,#B65A7B 0%,#7E3452 100%);box-shadow:none}
.hero:after{content:"";position:absolute;right:-40px;top:-40px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.12)}
.hero .k{font-size:13px;font-weight:600;opacity:.9}
.hero .d{font-size:40px;font-weight:850;letter-spacing:-1.5px;line-height:1.15;margin-top:2px}
.hero .m{font-size:14px;opacity:.95;margin-top:4px}
.hero.small{padding:16px 18px}
.hero.small .d{font-size:30px}

.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.stat{background:var(--soft);border-radius:20px;padding:15px 16px;display:flex;gap:11px;align-items:center;transition:background .25s}
.stat .ic{width:38px;height:38px;border-radius:50%;background:var(--bg);display:grid;place-items:center;color:var(--pink);flex:none}
.stat b{display:block;font-size:16px;font-weight:780;letter-spacing:-.4px}
.stat span{display:block;font-size:12px;color:var(--sub);line-height:1.35;word-break:keep-all}

.mstrip{margin-top:10px;width:100%;background:var(--soft);border-radius:18px;padding:13px 16px;display:flex;align-items:center;gap:10px;text-align:left}
.mstrip .t{flex:1;font-size:14px;font-weight:600}
.badge{min-width:22px;height:22px;padding:0 7px;border-radius:999px;background:var(--pink);color:#fff;font-size:12px;font-weight:700;display:inline-grid;place-items:center}

.evs{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.ev{height:28px;padding:0 11px;border-radius:999px;font-size:12.5px;font-weight:650;display:inline-flex;align-items:center;gap:5px;background:var(--pinkbg);color:var(--pink2)}
.ev.exam{background:var(--plum);color:#FFD4E0}
.ev.etc{background:var(--soft2);color:var(--sub)}

/* tasks */
.tasks{display:flex;flex-direction:column;gap:8px}
.task{display:flex;align-items:center;gap:8px;background:var(--bg);border:1.5px solid var(--line);border-radius:18px;padding:11px 12px 11px 6px;transition:border-color .2s,background .2s,opacity .2s}
.task.done{background:var(--soft)}
.task.done .tt,.task.skip .tt{color:var(--faint)}
.task.done .tt span.tx{text-decoration:line-through;text-decoration-color:var(--faint)}
.task.moved{opacity:.6}
.task.run{border-color:var(--pink);background:var(--pinkbg)}
.grip{width:26px;height:36px;display:grid;place-items:center;color:var(--faint);touch-action:none;cursor:grab;flex:none}
.grip svg.i{width:18px;height:18px}
.stb{width:30px;height:30px;border-radius:50%;border:2px solid var(--line2);display:grid;place-items:center;flex:none;font-size:15px;font-weight:700;transition:all .2s}
.stb.done{background:var(--pink);border-color:var(--pink);color:#fff}
.stb.part{border-color:var(--warn);color:var(--warn)}
.stb.moved{border-color:var(--faint);color:var(--sub)}
.stb.skip{border-color:var(--no);color:var(--no);background:var(--soft2)}
.stb svg.i{width:16px;height:16px;stroke-width:2.4}
.tt{flex:1;min-width:0;text-align:left;padding:2px 4px}
.tt .tl{font-size:14.5px;font-weight:600;line-height:1.35;word-break:keep-all}
.tt .sj{font-weight:700;margin-right:3px}
.tt .meta{font-size:12px;color:var(--sub);margin-top:2px;display:flex;gap:8px;flex-wrap:wrap}
.tt .meta i{font-style:normal;display:inline-flex;align-items:center;gap:3px}
.tt .meta svg.i{width:12px;height:12px}
.play{height:32px;padding:0 12px;border-radius:999px;border:1.5px solid var(--line2);font-size:12.5px;font-weight:650;display:inline-flex;align-items:center;gap:4px;flex:none;color:var(--text)}
.play svg.i{width:13px;height:13px}
.play.run{background:var(--cocoa);border-color:var(--cocoa);color:#fff;font-variant-numeric:tabular-nums}
.addbtn{width:100%;height:48px;border-radius:16px;border:1.5px dashed var(--line2);color:var(--pink);font-size:14px;font-weight:650;display:flex;align-items:center;justify-content:center;gap:6px;background:transparent;transition:background .2s}
.addbtn:active{background:var(--pinkbg)}
.empty{text-align:center;color:var(--sub);font-size:13.5px;padding:18px 0 10px}
.prog{height:6px;border-radius:9px;background:var(--soft2);overflow:hidden;margin-bottom:14px}
.prog i{display:block;height:100%;background:var(--pink);border-radius:9px;transition:width .35s var(--ease)}
.droplist{border-radius:20px;transition:background .15s,box-shadow .15s}
.droplist.hov{background:var(--pinkbg);box-shadow:0 0 0 2px var(--pink)}

/* timeline */
.tl2{position:relative}
.blk{display:flex;gap:12px;position:relative;padding-bottom:10px}
.blk:not(:last-child):before{content:"";position:absolute;left:17px;top:40px;bottom:2px;width:2px;background:var(--line)}
.bic{width:36px;height:36px;border-radius:50%;background:var(--bg);border:1.5px solid var(--line);display:grid;place-items:center;flex:none;color:var(--sub);margin-top:4px}
.bic svg.i{width:17px;height:17px}
.bcard{flex:1;min-width:0;border-radius:18px;padding:12px 14px;border:1.5px solid var(--line);background:var(--bg);transition:transform .15s,box-shadow .15s,border-color .15s}
.bcard.school{background:var(--school);border-color:var(--schoolL)}
.bcard.acad{background:var(--acad);border-color:var(--acadL)}
.bcard.free{background:var(--free);border-color:var(--freeL)}
.bcard.meal{background:var(--meal);border-color:var(--mealL)}
.bcard.unset{border-style:dashed;background:var(--soft)}
.bcard.hov{border-color:var(--pink);box-shadow:0 0 0 2px var(--pink);transform:scale(1.01)}
.bcard.now{box-shadow:0 0 0 2px var(--pink)}
.bh{display:flex;align-items:baseline;gap:8px}
.bh b{font-size:14.5px;font-weight:720}
.bh span{font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums}
.bh em{margin-left:auto;font-style:normal;font-size:11px;font-weight:700;color:var(--pink)}
.bph{font-size:12px;color:var(--faint);margin-top:3px}
.chips{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.chip{display:flex;align-items:center;gap:7px;min-height:34px;padding:6px 11px;border-radius:12px;background:var(--bg);font-size:13px;font-weight:600;text-align:left;touch-action:none;box-shadow:0 1px 0 var(--line)}
.chip .dot{width:8px;height:8px;border-radius:50%;flex:none}
.chip .s{margin-left:auto;font-size:12px;color:var(--sub);flex:none}
.chip.done{color:var(--faint);text-decoration:line-through}
.log{display:flex;align-items:center;gap:6px;min-height:28px;padding:4px 10px;border-radius:10px;background:rgba(210,99,138,.10);color:var(--pink2);font-size:12px;font-weight:650;font-variant-numeric:tabular-nums}
.log svg.i{width:13px;height:13px}

textarea.memo{width:100%;min-height:110px;border-radius:18px;border:1.5px solid var(--line);background:var(--soft);padding:14px 16px;resize:vertical;outline:none;font-size:14.5px;line-height:1.6;transition:border-color .2s}
textarea.memo:focus{border-color:var(--pink)}

.btn{height:52px;border-radius:16px;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px;width:100%;transition:transform .12s,background .2s}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--pink);color:#fff}
.btn.dark{background:var(--plum);color:#fff}
html[data-theme=dark] .btn.dark{background:var(--soft2)}
.btn.line{border:1.5px solid var(--line2);background:var(--bg)}
.btn.soft{background:var(--soft);color:var(--sub)}
.btn.warn{color:#D0566B;background:var(--soft)}
.btn:disabled{opacity:.45}

/* calendar */
.calh{display:flex;align-items:center;justify-content:space-between;margin:26px 0 10px}
.calh b{font-size:19px;font-weight:780}
.calh .nv{display:flex;gap:6px}
.calh .nv button{width:34px;height:34px;border-radius:50%;background:var(--soft);display:grid;place-items:center;color:var(--sub)}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.wd{text-align:center;font-size:12px;font-weight:600;color:var(--sub);padding:4px 0 8px}
.wd:first-child{color:#D0566B}.wd:last-child{color:#5C7DC2}
.cell{min-width:0;min-height:66px;border-radius:12px;padding:5px 2px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;transition:background .15s}
.cell:active{background:var(--soft)}
.cell.ex{background:var(--pinkbg)}
.cell .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:600}
.cell.out .n{color:var(--faint)}
.cell.sun .n{color:#D0566B}.cell.sat .n{color:#5C7DC2}
.cell.today .n{background:var(--pink);color:#fff}
.cell .dots{display:flex;gap:2px;height:6px}
.cell .dots i{width:5px;height:5px;border-radius:50%;background:var(--line2)}
.cell .dots i.on{background:var(--pink)}
.cell .el{font-size:9.5px;font-weight:700;line-height:1.2;max-width:100%;padding:1px 3px;border-radius:4px;background:var(--pink);color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .el.exam{background:var(--plum)}
.cell .el.etc{background:var(--soft2);color:var(--sub)}
.cell .sub{width:5px;height:5px;border-radius:50%;background:var(--ok)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--sub);margin-top:10px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:1px}

.list{display:flex;flex-direction:column;gap:8px}
.li{display:flex;align-items:center;gap:12px;background:var(--soft);border-radius:16px;padding:12px 14px}
.li .dd{width:44px;text-align:center;flex:none}
.li .dd b{display:block;font-size:17px;font-weight:780;line-height:1.1}
.li .dd span{font-size:11px;color:var(--sub)}
.li .tx{flex:1;min-width:0;font-size:14px;font-weight:600}
.li .tx span{display:block;font-size:12px;color:var(--sub);font-weight:500}
.icb{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--sub);flex:none}
.icb:active{background:var(--soft2)}

/* mission */
.ms{background:var(--soft);border-radius:20px;overflow:hidden;transition:background .2s}
.ms.lock{opacity:.55}
.msh{width:100%;display:flex;align-items:center;gap:11px;padding:15px 16px;text-align:left}
.msh .ic{width:38px;height:38px;border-radius:50%;background:var(--bg);display:grid;place-items:center;color:var(--pink);flex:none}
.msh .t{flex:1;min-width:0}
.msh .t b{display:block;font-size:14.5px;font-weight:700;line-height:1.35}
.msh .t span{font-size:12px;color:var(--sub)}
.tag{height:22px;padding:0 8px;border-radius:999px;font-size:11px;font-weight:700;background:var(--pinkbg);color:var(--pink2);display:inline-flex;align-items:center;flex:none}
.tag.brown{background:rgba(168,118,91,.16);color:var(--cocoa)}
.tag.gray{background:var(--soft2);color:var(--sub)}
.tag.ok{background:rgba(91,154,110,.15);color:var(--ok)}
.chev{transition:transform .22s var(--ease);color:var(--faint)}
.ms.open .chev{transform:rotate(180deg)}
.msb{display:grid;grid-template-rows:0fr;transition:grid-template-rows .25s var(--ease)}
.ms.open .msb{grid-template-rows:1fr}
.msb>div{overflow:hidden}
.msin{padding:0 16px 16px}
.msin ul{background:var(--bg);border-radius:14px;padding:13px 14px 13px 30px;font-size:13.5px;line-height:1.65}
.msin li+li{margin-top:5px}
.msin .btn{height:44px;margin-top:10px;font-size:14px}
.ck{display:flex;align-items:flex-start;gap:10px;padding:9px 4px;font-size:13.5px;line-height:1.5;text-align:left;width:100%}
.ck+.ck{border-top:1px solid var(--line)}
.ck .bx{width:22px;height:22px;border-radius:7px;border:2px solid var(--line2);display:grid;place-items:center;flex:none;margin-top:0;transition:all .18s;color:#fff}
.ck.on .bx{background:var(--pink);border-color:var(--pink)}
.ck.on .ctx{color:var(--sub)}
.ck .bx svg.i{width:13px;height:13px;stroke-width:3}
.ckwrap{background:var(--bg);border-radius:14px;padding:4px 12px}
.ctx input{width:68px;height:28px;border:0;border-bottom:1.5px solid var(--pink);background:transparent;text-align:center;font-weight:700;color:var(--pink2);outline:none;margin:0 3px}

/* settings */
.card{background:var(--soft);border-radius:22px;padding:18px;margin-top:12px;transition:background .25s}
.fl{display:block;font-size:12.5px;font-weight:650;color:var(--sub);margin:0 0 6px 2px}
.fi{width:100%;height:46px;border-radius:13px;border:1.5px solid var(--line);background:var(--bg);padding:0 14px;outline:none;font-size:15px;transition:border-color .2s}
.fi:focus{border-color:var(--pink)}
.fgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.fi{min-width:0}input[type=date].fi{padding:0 10px;font-size:14px}
.fgap{margin-top:12px}
.seg{display:flex;background:var(--soft2);border-radius:13px;padding:3px;gap:3px}
.seg button{flex:1;height:36px;border-radius:10px;font-size:13.5px;font-weight:650;color:var(--sub);transition:background .2s,color .2s}
.seg button.on{background:var(--bg);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.pills{display:flex;flex-wrap:wrap;gap:7px}
.pill{height:36px;padding:0 13px;border-radius:999px;border:1.5px solid var(--line2);background:var(--bg);font-size:13.5px;font-weight:650;display:inline-flex;align-items:center;gap:6px;transition:background .18s,border-color .18s,color .18s}
.pill.on{background:var(--pink);border-color:var(--pink);color:#fff}
.pill .dot{width:9px;height:9px;border-radius:50%}
.pill.on .dot{box-shadow:0 0 0 2px #fff}
.brow{background:var(--bg);border-radius:16px;padding:12px;margin-top:8px}
.brow .r1{display:flex;gap:8px;align-items:center}
.brow .r1 .fi{height:40px;font-size:14px}
.brow .r2{display:flex;gap:6px;align-items:center;margin-top:8px}
.brow .r2 input[type=time]{height:38px;border-radius:11px;border:1.5px solid var(--line);background:var(--soft);padding:0 8px;font-size:13.5px;outline:none;flex:1;min-width:0}
.brow .tp{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap}
.brow .tp button{height:30px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:650;border:1.5px solid var(--line);color:var(--sub);transition:all .18s}
.brow .tp button.on{border-color:var(--pink);background:var(--pinkbg);color:var(--pink2)}
.acct{display:flex;align-items:center;gap:12px}
.acct .av{width:44px;height:44px;border-radius:50%;background:var(--bg);display:grid;place-items:center;color:var(--pink);overflow:hidden;flex:none}
.acct .av img{width:100%;height:100%;object-fit:cover}
.acct .tx{flex:1;min-width:0}
.acct .tx b{display:block;font-size:15px}
.acct .tx span{font-size:12.5px;color:var(--sub)}

/* nav */

/* ===== 벼키클 스타일 ===== */

#topR{display:flex;gap:6px}
.sti.range{background:var(--card);border:1.5px solid var(--line2);font-weight:600}

/* ===== 월간 달력 v2 ===== */
.calbox{padding:16px 8px 12px}
.calbox .grid{gap:0}
.calbox .wd{font-size:11.5px;font-weight:600;color:var(--faint);padding:0 0 6px}
.calbox .wd:first-child{color:#E07A8F}.calbox .wd:last-child{color:#7C96D0}
.calbox .cell{min-height:62px;border-radius:12px;padding:6px 1px 4px;gap:3px;position:relative;justify-content:flex-start}
.calbox .cell.ex{background:none}
.calbox .cell .n{width:28px;height:28px;font-size:14px;font-weight:600}
.calbox .cell.ex .n{color:var(--c-exam);font-weight:800}
.calbox .cell.today .n{background:#E2526E;color:#fff;font-weight:700}
.calbox .cell .dots{gap:3px;height:5px}
.calbox .cell .dots i{width:4px;height:4px}
.exl{font-size:9px;font-weight:700;color:#fff;background:var(--c-exam);line-height:1;padding:3px 6px;border-radius:999px}
html[data-theme=dark] .exl{color:#2A1B21}
.pbar{width:20px;height:4px;border-radius:9px;background:var(--line2);overflow:hidden;display:block}
.pbar i{display:block;height:100%;background:var(--pink);border-radius:9px}
.lgbar{display:inline-block;width:16px;height:4px;border-radius:9px;background:linear-gradient(90deg,var(--pink) 60%,var(--line2) 60%);margin-right:4px;vertical-align:2px}
.lgex{font-size:10px;font-weight:700;color:#fff;background:var(--c-exam);padding:2px 7px;border-radius:999px}
html[data-theme=dark] .lgex{color:#2A1B21}
.calbox .cell{overflow:hidden;min-width:0}
.evw{align-self:stretch;display:flex;flex-direction:column;gap:3px;padding:0 2px;min-width:0}
.evl{font-size:9px;font-weight:600;color:var(--text);line-height:1.25;display:flex;align-items:flex-start;gap:2px;min-width:0;text-align:left}
.evl:before{content:"";width:3px;height:3px;border-radius:50%;background:var(--sub);flex:none;margin-top:4.5px}
.evl b{font-weight:600;min-width:0;word-break:keep-all;overflow-wrap:anywhere}
.evl .full,.evl .short,.evl .tiny{display:none}

.sbar{flex:1;height:10px;border-radius:9px;background:var(--soft2);position:relative;overflow:hidden}
.sbar i{position:absolute;left:0;top:0;bottom:0;border-radius:9px}.sbar i.p{background:var(--line2)}.sbar i.a{opacity:.9}

.lth{width:100%;text-align:left;padding:2px 4px 8px}.lbox .lth .chev{margin-left:8px;transition:transform .22s var(--ease)}.lbox.open .lth .chev{transform:rotate(180deg)}

.letter p+p{margin-top:12px}.lfrom{text-align:right;color:var(--sub);font-weight:650;font-size:13.5px}

const DAYSTART=5*60;
const adj=t=>{const m=toM(t);return m<DAYSTART?m+1440:m};
const fmtT=m=>{m%=1440;return `${pad(Math.floor(m/60))}:${pad(m%60)}`};
function fullBlocks(dow){
  const src=(PLAN.week[dow]||[]).map(([label,s,e,type])=>{let a=adj(s),b=adj(e);if(b<=a)b+=1440;return{label,s,e,type,a,b,id:dow+'-'+s.replace(':','')}}).sort((x,y)=>x.a-y.a);
  const out=[];let c=DAYSTART;
  for(const b of src){if(b.a-c>=30)out.push({id:dow+'-u'+fmtT(c).replace(':',''),label:'미정',s:fmtT(c),e:fmtT(b.a),type:'unset'});out.push(b);c=Math.max(c,b.b)}
  if(DAYSTART+1440-30-c>=30)out.push({id:dow+'-u'+fmtT(c).replace(':',''),label:'미정',s:fmtT(c),e:fmtT(DAYSTART+1440-30),type:'unset'});
  return out;
}

function dday(){
  const t=today(),e=S.exam;if(!e||!e.start)return null;
  const n=diff(t,e.start);
  if(n>0)return{n,label:`D-${n}`};
  if(e.end&&diff(t,e.end)>=0)return{n:0,label:'시험 기간'};
  if(n===0)return{n:0,label:'D-DAY'};
  return null;
}
function streak(){
  let c=0,d=today();
  if(!(peek(d)&&peek(d).sub))d=addD(d,-1);
  while(peek(d)&&peek(d).sub){c++;d=addD(d,-1)}
  let best=0,run=0;const ks=Object.keys(S.days).filter(k=>S.days[k].sub).sort();
  let prev=null;for(const k of ks){run=(prev&&diff(prev,k)===1)?run+1:1;best=Math.max(best,run);prev=k}
  return{c,best:Math.max(best,c)};
}

let GS=DAYSTART,GH=24,G10S=DAYSTART,G10H=24;
function gridRange(dates){
  let lo=Infinity,hi=-Infinity;
  for(const d of dates){
    for(const b of blocksOf(d))if(b.type==='school'||b.type==='acad'||b.type==='meal'){let a=adj(b.s),c=adj(b.e);if(c<=a)c+=1440;lo=Math.min(lo,a);hi=Math.max(hi,c)}
    for(const x of (peek(d)?.tasks||[]))if(x.ts&&x.st!=='moved'){let a=adj(x.ts),c=adj(x.te||addTime(x.ts,x.min||30));if(c<=a)c+=1440;lo=Math.min(lo,a);hi=Math.max(hi,c)}
  }
  if(lo===Infinity){lo=7*60;hi=24*60}
  let s0=Math.floor(lo/60)*60,e0=Math.min(DAYSTART+1440,Math.ceil(hi/60)*60+60);
  if(e0-s0<360)e0=Math.min(DAYSTART+1440,s0+360);
  return [s0,(e0-s0)/60];
}

const R10=38;
function rGrid10(d){
  const dy=day(d);G10S=DAYSTART;G10H=24;const hours=[...Array(G10H)].map((_,i)=>G10S+i*60);
  const segs=(a,c)=>{const out=[];for(let r=0;r<G10H;r++){const rs=G10S+r*60,re=rs+60,x=Math.max(a,rs),y=Math.min(c,re);if(y>x)out.push({r,l:(x-rs)/60*100,w:(y-x)/60*100,first:x===a})}return out};
  const bgs=blocksOf(d).filter(b=>b.type==='school'||b.type==='acad'||b.type==='meal').map(b=>{let a=adj(b.s),c=adj(b.e);if(c<=a)c+=1440;return{b,a,c}});
  const tl=dy.tasks.filter(x=>x.ts&&x.st!=='moved').map(x=>{let a=adj(x.ts),c=adj(x.te||addTime(x.ts,x.min||30));if(c<=a)c+=1440;return{x,a,c}});
  const now=adj(hm(new Date())),isT=d===today();
  const rows=hours.map((rs,r)=>{
    let h='';
    for(const {b,a,c} of bgs)for(const sg of segs(a,c))if(sg.r===r)h+=`<div class="g10bg ${b.type}" style="left:${sg.l}%;width:${sg.w}%">${sg.first||sg.l===0&&r===Math.floor((a-G10S)/60)?`<span>${esc(b.label)}</span>`:''}</div>`;
    for(const {x,a,c} of tl)for(const sg of segs(a,c))if(sg.r===r)h+=`<button class="g10it ${x.st||''}" data-act="editTask" data-id="${x.id}" style="left:${sg.l}%;width:${sg.w}%;--c:${subjC(x.subj)}">${sg.first?`<b>${esc(x.title)}</b>`:''}</button>`;
    if(isT&&now>=rs&&now<rs+60)h+=`<div class="g10now" style="left:${(now-rs)/60*100}%"></div>`;
    return `<div class="g10r"><div class="g10h">${(rs/60|0)%24}</div><div class="g10c" data-r="${r}">${h}</div></div>`}).join('');
  return `<div class="g10" id="g10">${rows}</div><div class="dsub" style="margin-top:8px">빈 칸을 꾹 누른 채 끌면 10분 단위로 일정이 만들어져요.</div>`;
}
let P10=null;
function m10(x,y){const g=$('#g10');if(!g)return null;const rows=[...g.querySelectorAll('.g10c')];let r=rows.findIndex(c=>{const b=c.getBoundingClientRect();return y>=b.top&&y<b.bottom});if(r<0)r=y<rows[0].getBoundingClientRect().top?0:rows.length-1;const b=rows[r].getBoundingClientRect();let k=Math.floor((x-b.left)/b.width*6);k=Math.max(0,Math.min(5,k));return G10S+r*60+k*10}
function p10Draw(){const a=Math.min(P10.m0,P10.m1),c=Math.max(P10.m0,P10.m1)+10;$$('.g10prev').forEach(n=>n.remove());const rows=$$('#g10 .g10c');
  for(let r=0;r<G10H;r++){const rs=G10S+r*60,x=Math.max(a,rs),y=Math.min(c,rs+60);if(y>x){const p=document.createElement('div');p.className='g10prev';p.style.left=(x-rs)/60*100+'%';p.style.width=(y-x)/60*100+'%';if(x===a)p.textContent=`${fmtT(a)}-${fmtT(c)}`;rows[r].appendChild(p)}}}
document.addEventListener('pointerdown',e=>{
  if(tab!=='day'||S.dmode!=='grid')return;const c=e.target.closest('.g10c');if(!c||e.target.closest('.g10it'))return;
  P10={x:e.clientX,y:e.clientY,on:false,m0:m10(e.clientX,e.clientY)};P10.m1=P10.m0;
  if(e.pointerType!=='mouse')P10.t=setTimeout(()=>{if(P10&&!P10.on){P10.on=true;p10Draw();if(navigator.vibrate)try{navigator.vibrate(10)}catch(_){}}},300);
});
document.addEventListener('pointermove',e=>{
  if(!P10)return;const dist=Math.hypot(e.clientX-P10.x,e.clientY-P10.y);
  if(!P10.on){if(e.pointerType==='mouse'&&dist>4){P10.on=true}else if(e.pointerType!=='mouse'&&dist>8){clearTimeout(P10.t);P10=null}return}
  e.preventDefault();P10.m1=m10(e.clientX,e.clientY);p10Draw();
},{passive:false});
document.addEventListener('touchmove',e=>{if(P10&&P10.on)e.preventDefault()},{passive:false});
document.addEventListener('pointerup',()=>{if(!P10)return;clearTimeout(P10.t);if(P10.on){noClick=Date.now()+350;const a=Math.min(P10.m0,P10.m1),c=Math.max(P10.m0,P10.m1)+10;$$('.g10prev').forEach(n=>n.remove());P10=null;taskSheet(null,{ts:fmtT(a),te:fmtT(c)});return}P10=null});
document.addEventListener('pointercancel',()=>{if(P10){clearTimeout(P10.t);$$('.g10prev').forEach(n=>n.remove());P10=null}});

function autoSlot(d,min,skipId,only){
  const fr=blocksOf(d).filter(b=>only?b.id===only:b.type==='free').map(b=>{let a=adj(b.s),c=adj(b.e);if(c<=a)c+=1440;return[a,c]});
  const busy=(peek(d)?.tasks||[]).filter(t=>t.ts&&t.st!=='moved'&&t.id!==skipId).map(t=>{let a=adj(t.ts),c=adj(t.te||addTime(t.ts,t.min||30));if(c<=a)c+=1440;return[a,c]}).sort((x,y)=>x[0]-y[0]);
  let lo=DAYSTART;if(d===today()){const n=adj(hm(new Date()));lo=Math.ceil(n/10)*10}
  for(const [a,c] of fr){let st=Math.max(a,lo);
    for(const [p,q] of busy){if(q<=st||p>=c)continue;if(p-st>=min)break;st=Math.max(st,q+10)}
    if(st+min<=c)return[fmtT(st),fmtT(st+min)]}
  return null;
}

/* ===== drag & drop ===== */
let DG=null;
document.addEventListener('pointerdown',e=>{
  const h=e.target.closest('[data-drag]');if(!h||tab!=='day')return;
  const t=findTask(cur,h.dataset.drag);if(!t||t.st==='moved')return;
  DG={id:t.id,x:e.clientX,y:e.clientY,on:false,h,pid:e.pointerId,t,isGrip:h.classList.contains('grip'),timer:null};
  if(!DG.isGrip){DG.timer=setTimeout(()=>{if(DG&&!DG.on)beginDrag()},260)}
});
function beginDrag(){
  DG.on=true;document.body.classList.add('dragging');
  const g=document.createElement('div');g.className='ghostdrag';g.innerHTML=`<span style="color:${subjC(DG.t.subj)}">[${esc(DG.t.subj)}]</span> ${esc(DG.t.title)}`;
  document.body.appendChild(g);DG.g=g;moveGhost(DG.x,DG.y);
  const row=document.querySelector(`.task[data-tid="${DG.id}"]`);if(row)row.classList.add('src');
  if(navigator.vibrate)try{navigator.vibrate(12)}catch(e){}
  loop();
}
function moveGhost(x,y){DG.g.style.left=x+'px';DG.g.style.top=y+'px';
  $$('[data-drop].hov').forEach(n=>n.classList.remove('hov'));
  const el=document.elementFromPoint(x,y),d=el&&el.closest('[data-drop]');if(d)d.classList.add('hov');DG.over=d}
function loop(){if(!DG||!DG.on)return;const y=DG.y;let m=0;if(y<130)m=-10;else if(y>innerHeight-110)m=10;if(m){window.scrollBy(0,m);moveGhost(DG.x,DG.y)}requestAnimationFrame(loop)}
document.addEventListener('pointermove',e=>{
  if(!DG)return;
  const dx=e.clientX-DG.x,dy=e.clientY-DG.y;
  if(!DG.on){
    if(DG.isGrip&&Math.hypot(dx,dy)>5){beginDrag()}
    else if(!DG.isGrip&&Math.hypot(dx,dy)>10){clearTimeout(DG.timer);DG=null;return}
    else return;
  }
  e.preventDefault();DG.x=e.clientX;DG.y=e.clientY;moveGhost(DG.x,DG.y);
},{passive:false});
document.addEventListener('touchmove',e=>{if(DG&&DG.on)e.preventDefault()},{passive:false});
function endDrag(){
  if(!DG)return;clearTimeout(DG.timer);
  if(DG.on){
    noClick=Date.now()+350;
    const d=DG.over,t=findTask(cur,DG.id);
    if(d&&t){const v=d.dataset.drop;const nb=v==='list'?null:v.slice(2);if(t.block!==nb){t.block=nb;save();const b=blocksOf(cur).find(x=>x.id===nb);toast(b?`${b.label}에 배치했어요`:'배치를 뺐어요')}}
    DG.g.remove();document.body.classList.remove('dragging');$$('.hov').forEach(n=>n.classList.remove('hov'));
    DG=null;render();return;
  }
  DG=null;
}
document.addEventListener('pointerup',endDrag);document.addEventListener('pointercancel',()=>{if(DG&&!DG.on){clearTimeout(DG.timer);DG=null}else endDrag()});
document.addEventListener('contextmenu',e=>{if(e.target.closest('[data-drag]'))e.preventDefault()});


/* ===== week grid paint ===== */
let PG=null;
const snapM=(col,y)=>{const r=col.getBoundingClientRect();let m=GS+Math.floor((y-r.top)/ROWH*6)*10;return Math.max(GS,Math.min(GS+GH*60-10,m))};
document.addEventListener('pointerdown',e=>{
  if(tab!=='week'||wkMode!=='grid')return;
  const col=e.target.closest('.wcol');if(!col||e.target.closest('.witem'))return;
  PG={col,d:col.dataset.d,x:e.clientX,y:e.clientY,on:false,m0:snapM(col,e.clientY)};PG.m1=PG.m0;
  if(e.pointerType!=='mouse')PG.t=setTimeout(()=>{if(PG&&!PG.on)paintStart()},300);
});
function paintStart(){PG.on=true;const p=document.createElement('div');p.className='wprev';PG.col.appendChild(p);PG.p=p;paintDraw();if(navigator.vibrate)try{navigator.vibrate(10)}catch(e){}}
function paintDraw(){const a=Math.min(PG.m0,PG.m1),b=Math.max(PG.m0,PG.m1)+10;PG.p.style.top=(a-GS)/60*ROWH+'px';PG.p.style.height=(b-a)/60*ROWH+'px';PG.p.textContent=`${fmtT(a)} - ${fmtT(b)}`}
document.addEventListener('pointermove',e=>{
  if(!PG)return;const dist=Math.hypot(e.clientX-PG.x,e.clientY-PG.y);
  if(!PG.on){if(e.pointerType==='mouse'&&dist>4)paintStart();else if(e.pointerType!=='mouse'&&dist>8){clearTimeout(PG.t);PG=null}return}
  e.preventDefault();PG.m1=snapM(PG.col,e.clientY);paintDraw();
},{passive:false});
document.addEventListener('touchmove',e=>{if(PG&&PG.on)e.preventDefault()},{passive:false});
function paintEnd(){
  if(!PG)return;clearTimeout(PG.t);
  if(PG.on){noClick=Date.now()+350;const a=Math.min(PG.m0,PG.m1),b=Math.max(PG.m0,PG.m1)+10;PG.p.remove();cur=PG.d;PG=null;taskSheet(null,{ts:fmtT(a),te:fmtT(b)});return}
  PG=null;
}
document.addEventListener('pointerup',paintEnd);document.addEventListener('pointercancel',()=>{if(PG){clearTimeout(PG.t);if(PG.p)PG.p.remove();PG=null}});
document.addEventListener('contextmenu',e=>{if(e.target.closest('.wcol'))e.preventDefault()});

/* ===== 뒤로가기 ===== */
const navStack=[];let sheetPushed=false,ignorePop=0;
function snap(){return{tab,cur,wk,wkMode}}
function pushNav(){navStack.push(snap());try{history.pushState({n:navStack.length},'')}catch(e){}}
function restore(st){tab=st.tab;cur=st.cur;wk=st.wk;wkMode=st.wkMode;window.scrollTo(0,0);render(true)}
window.addEventListener('popstate',()=>{
  if(ignorePop){ignorePop--;return}
  if(sheetPushed&&$('#sheet').classList.contains('on')){sheetPushed=false;closeSheet(true);return}
  sheetPushed=false;
  if(navStack.length){restore(navStack.pop());return}
});
/* ===== theme ===== */
const mq=matchMedia('(prefers-color-scheme: dark)');
function applyTheme(){const dk=S.theme==='dark'||(S.theme==='auto'&&mq.matches);document.documentElement.dataset.theme=dk?'dark':'light';$('meta[name=theme-color]').content=dk?'#8E3E5A':'#EC9AB2'}
mq.addEventListener?.('change',applyTheme);

/* ===== Firebase sync ===== */
let fbReady=false,fbUser=null,fbRef=null,fbUnsub=null,syncMsg='',pushT=null,applying=false;
function loadScript(src){return new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=no;document.head.appendChild(s)})}
async function cloudInit(){
  if(!firebaseConfig.apiKey)return;
  try{
    const v='10.12.2',b=`https://www.gstatic.com/firebasejs/${v}/`;
    await loadScript(b+'firebase-app-compat.js');await loadScript(b+'firebase-auth-compat.js');await loadScript(b+'firebase-firestore-compat.js');
    firebase.initializeApp(firebaseConfig);fbReady=true;
    firebase.auth().getRedirectResult().catch(()=>{});
    firebase.auth().onAuthStateChanged(u=>{fbUser=u;if(u)startSync();else{fbUnsub&&fbUnsub();fbUnsub=null;fbRef=null}refreshSet()});
  }catch(e){fbReady=false}
  refreshSet();
}
async function startSync(){
  fbRef=firebase.firestore().collection(FB_COLLECTION).doc(fbUser.uid);
  try{
    const snap=await fbRef.get();
    if(snap.exists){const r=snap.data();if(r.updatedAt>S.updatedAt){applyRemote(r)}else if(S.updatedAt>r.updatedAt)push()}
    else push();
    fbUnsub=fbRef.onSnapshot(s=>{if(!s.exists||s.metadata.hasPendingWrites)return;const r=s.data();if(r.updatedAt>S.updatedAt)applyRemote(r)});
    syncMsg='';
  }catch(e){syncMsg='동기화에 실패했어요. Firestore 규칙을 확인해 주세요'}
  refreshSet();
}
function applyRemote(r){try{const d=JSON.parse(r.data);S=d;for(const k in F)if(S[k]===undefined)S[k]=F[k];applyPlan();localStorage.setItem(KEY,JSON.stringify(S));applyTheme();if(!($('#sheet').classList.contains('on')||document.activeElement?.id==='memo'))render()}catch(e){}}
function push(){if(!fbRef)return;fbRef.set({data:JSON.stringify(S),updatedAt:S.updatedAt}).catch(()=>{syncMsg='동기화에 실패했어요';refreshSet()})}
function cloudPush(){if(!fbRef)return;clearTimeout(pushT);pushT=setTimeout(push,800)}
async function fbLogin(){
  const p=new firebase.auth.GoogleAuthProvider();
  try{await firebase.auth().signInWithPopup(p)}catch(e){if(e&&(e.code==='auth/popup-blocked'||e.code==='auth/operation-not-supported-in-this-environment'))firebase.auth().signInWithRedirect(p);else toast('로그인을 못 했어요')}
}
function fbLogout(){firebase.auth().signOut();toast('로그아웃했어요')}

/* ===== start ===== */
applyPlan();applyTheme();render(true);cloudInit();

document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&today()!==lastDay){if(cur===lastDay)cur=today();lastDay=today();render()}});
if('serviceWorker' in navigator){try{navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}}
